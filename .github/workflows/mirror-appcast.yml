# Copies the live TimeTug appcast into this user site so copies that still check
# https://darkarena1.github.io/timetug/appcast.xml keep receiving updates.
name: Mirror appcast
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror-appcast
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch and validate the live appcast
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/appcast.xml" https://timetug.binarycompanion.com/appcast.xml
          python3 - "$RUNNER_TEMP/appcast.xml" <<'PY'
          import sys, xml.dom.minidom
          d = xml.dom.minidom.parse(sys.argv[1])
          items = d.getElementsByTagName("item")
          assert d.documentElement.tagName == "rss", "not an RSS document"
          assert len(items) >= 1, "no items in the feed"
          print(f"valid appcast with {len(items)} items")
          PY
          cp "$RUNNER_TEMP/appcast.xml" timetug/appcast.xml
      - name: Commit when changed (and once a month so scheduled runs are not disabled)
        run: |
          set -euo pipefail
          date -u +%Y-%m > .keepalive
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Mirror appcast"
            git push
          else
            echo "No change."
          fi
